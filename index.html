try{await auth.signInWithEmailAndPassword(u+DOM,p);$("#l_p").value="";$("#l_e").textContent=""}catch(e){$("#l_e").textContent=/network/.test(e.code||"")?"Tidak ada koneksi internet.":"Username atau password salah."}}
function logout(){auth.signOut()}
const V={
dash(){const lim=per==="a"?0:Date.now()-{d:864e5,w:6048e5,m:2592e6}[per],L=rows.filter(t=>t.tgl>=lim&&t.status!=="Diminta"),A={};
let sd=0,sr=0,sm=0,sv=0;
L.forEach(t=>t.items.forEach(i=>{const a=A[i.k]=A[i.k]||{d:0,o:0,r:0,m:0,v:0,u:0};a.d+=i.dis;sd+=i.dis;
if(i.st==="Belum Diinput")a.o+=i.dis;else{a.r+=i.ret;sr+=i.ret;a.u+=i.dis-i.ret;if(i.st==="Menunggu Verifikasi"){a.m+=i.ret;sm+=i.ret}if(i.st==="Terverifikasi"){a.v+=i.ret;sv+=i.ret}}}));
const so=L.filter(t=>t.status==="Diserahkan ke OK").length,K=(v,l,c)=>`<div class="k"><b class="${c||""}">${v}</b><span>${l}</span></div>`,
ks=Object.keys(A).sort((x,y)=>A[y].d-A[x].d),
sel=`<select onchange="setPer(this.value)" style="width:auto;margin-bottom:10px">${[["d","Hari ini (24 jam)"],["w","7 hari terakhir"],["m","30 hari terakhir"],["a","Semua"]].map(([v,l])=>`<option value="${v}"${v===per?" selected":""}>${l}</option>`).join("")}</select>`;
return sel+`<div class="kpi">${K(L.length,"Transaksi diserahkan Farmasi")}${K(r2(sd),"Unit diserahkan Farmasi \u2192 OK")}${K(r2(sr),"Unit sisa dikembalikan OK")}${K(r2(sm),"Retur menunggu verifikasi",sm?"low":"")}${K(r2(sv),"Retur terverifikasi","good")}${K(so,"Transaksi belum input retur",so?"low":"")}</div>`+(ks.length?`<div class="card wrap"><table><tr><th>Barang</th><th>Diserahkan</th><th>Belum input retur</th><th>Retur dari OK</th><th>Menunggu verifikasi</th><th>Terverifikasi</th><th>Terpakai</th><th>% retur</th></tr>${ks.map(k=>{const a=A[k],c=a.d-a.o;return `<tr><td>${nm(k)}</td><td>${r2(a.d)}</td><td>${r2(a.o)}</td><td>${r2(a.r)}</td><td class="${a.m?"low":""}">${r2(a.m)}</td><td>${r2(a.v)}</td><td>${r2(a.u)}</td><td>${c>0?Math.round(a.r/c*1000)/10+"%":"-"}</td></tr>`}).join("")}</table></div><p class="muted">Terpakai dan % retur dihitung dari transaksi yang input retur-nya sudah ditutup.</p>`:empty("Belum ada barang yang diserahkan pada periode ini."))},
new(){return `<div class="card"><h2>Permintaan BMHP ke Farmasi</h2>
<label>Nama pasien / ID</label><input id="f_p" maxlength="60">
<label>Dokter</label><select id="f_d">${DR.map(d=>`<option>${esc(d)}</option>`).join("")}</select>
<label>Jenis operasi (paket BMHP)</label><select id="f_o" onchange="prev()">${Object.keys(PK).map(d=>`<option>${esc(d)}</option>`).join("")}</select>
<div class="wrap" id="prev"></div>
<label>Tambah barang di luar paket (opsional, mis. lensa / komplikasi)</label>
<div style="display:flex;gap:6px"><select id="x_k">${xopts()}</select><input id="x_q" type="number" step="any" min="0" value="1" style="width:90px"><button class="btn s" type="button" onclick="addX()">Tambah</button></div>
<div class="wrap" id="xl"></div>
<label>Catatan</label><textarea id="f_c" rows="2"></textarea>
<button class="btn" onclick="kirim()">Kirim ke Farmasi</button></div>`},
queue(){const s=stok(),l=rows.filter(t=>t.status==="Diminta");if(!l.length)return empty("Tidak ada permintaan baru.");
return l.map(t=>`<div class="card">${head(t)}<div class="wrap"><table><tr><th>Barang</th><th>Diminta</th><th>Stok</th><th>Disiapkan</th></tr>${t.items.map(i=>`<tr><td>${nm(i.k)}</td><td>${i.dim}</td><td class="${s[i.k]<i.dim?"low":""}">${s[i.k]}</td><td><input type="number" step="any" min="0" max="${s[i.k]}" value="${i.dis}" data-t="${t.id}" data-k="${i.k}"></td></tr>`).join("")}</table></div>
<button class="btn" onclick="serah('${t.id}')">✔ Diserahkan ke OK</button></div>`).join("")},
retur(){const l=rows.filter(t=>t.status==="Diserahkan ke OK");if(!l.length)return empty("Tidak ada pasien yang menunggu input retur.");
return `<p class="muted">Isi HANYA barang yang sisa. Barang yang tidak diisi dihitung terpakai.</p>`+l.map(t=>`<div class="card">${head(t)}<div class="wrap"><table><tr><th>Barang</th><th>Disiapkan</th><th>Sisa dikembalikan</th></tr>${t.items.map(i=>`<tr><td>${nm(i.k)}</td><td>${i.dis}</td><td><input type="number" step="any" min="0" max="${i.dis}" value="0" data-t="${t.id}" data-k="${i.k}"></td></tr>`).join("")}</table></div>
<button class="btn" onclick="tutup('${t.id}')">Tutup Input Retur</button></div>`).join("")},
verif(){const l=rows.filter(t=>t.status==="Menunggu Verifikasi Retur");if(!l.length)return empty("Tidak ada retur yang perlu diverifikasi.");
return l.map(t=>`<div class="card">${head(t)}<div class="wrap"><table><tr><th>Barang</th><th>Retur</th><th></th></tr>${t.items.filter(i=>i.st!=="Tidak Ada Retur").map(i=>`<tr><td>${nm(i.k)}</td><td>${i.ret}</td><td>${i.st==="Terverifikasi"?`<span class="good">Terverifikasi</span>`:`<button class="btn s" onclick="verif('${t.id}','${i.k}')">Verifikasi Retur</button>`}</td></tr>`).join("")}</table></div></div>`).join("")},
stok(){const s=stok();return `<div class="card wrap"><table><tr><th>Kode</th><th>Barang</th><th>Satuan</th><th>Stok real</th></tr>${Object.keys(BM).map(k=>`<tr><td>${k}</td><td>${nm(k)}</td><td>${BM[k][1]}</td><td class="${s[k]<20?"low":""}"><b>${s[k]}</b></td></tr>`).join("")}</table></div><p class="muted">Stok real = stok awal − yang diserahkan ke OK + retur yang sudah diverifikasi.</p>`},
hist(){if(!rows.length)return empty("Belum ada transaksi.");
return rows.map(t=>`<div class="card">${head(t)}<div class="wrap"><table><tr><th>Barang</th><th>Disiapkan</th><th>Retur</th><th>Terpakai</th></tr>${t.items.map(i=>`<tr><td>${nm(i.k)}</td><td>${t.status==="Diminta"?"-":i.dis}</td><td>${i.ret}</td><td>${["Diminta","Diserahkan ke OK"].includes(t.status)?"-":i.dis-i.ret}</td></tr>`).join("")}</table></div></div>`).join("")}
};
function render(){
const w=who();$("#lg").style.display=w.s==="ok"?"none":"flex";
if(w.s!=="ok")return;
if(need>0){$("#view").innerHTML=empty("Memuat\u2026");return}
role=w.role;
$("#roles").innerHTML=`<span class="tag">${esc(w.nama)}${role==="Admin"?"":" \u00b7 "+(role==="OK"?"Kamar Operasi":esc(role))}</span> <button class="btn s" onclick="logout()">Keluar</button>`;
const ks=Object.keys(TABS).filter(k=>TABS[k][1]==="*"||role==="Admin"||TABS[k][1]===role);if(!ks.includes(tab))tab=ks[0];
const badge=k=>{const n={queue:rows.filter(t=>t.status==="Diminta").length,retur:rows.filter(t=>t.status==="Diserahkan ke OK").length,verif:rows.filter(t=>t.status==="Menunggu Verifikasi Retur").length}[k];return n?` (${n})`:""};
$("#tabs").innerHTML=ks.map(k=>`<button class="${k===tab?"on":""}" onclick="setTab('${k}')">${TABS[k][0]}${badge(k)}</button>`).join("");
$("#view").innerHTML=V[tab]();if(tab==="new")prev()}
function setPer(p){per=p;render()}
function setTab(k){tab=k;render()}
let extra={};
function xopts(){const g={};for(const k in BM)(g[BM[k][3]]=g[BM[k][3]]||[]).push(k);return Object.keys(g).map(c=>`<optgroup label="${esc(c)}">${g[c].map(k=>`<option value="${k}">${nm(k)}</option>`).join("")}</optgroup>`).join("")}
function renderX(){const e=$("#xl");if(!e)return;const ks=Object.keys(extra);e.innerHTML=ks.length?`<table>${ks.map(k=>`<tr><td>${nm(k)}</td><td>${extra[k]}</td><td><button class="btn s" type="button" onclick="delX('${k}')">Hapus</button></td></tr>`).join("")}</table>`:""}
function addX(){const k=$("#x_k").value,q=Math.round((+$("#x_q").value||0)*100)/100;if(q<=0)return toast("Isi jumlah lebih dari 0.");extra[k]=Math.round(((extra[k]||0)+q)*100)/100;renderX()}
function delX(k){delete extra[k];renderX()}
function prev(){const o=$("#f_o");if(!o)return;renderX();$("#prev").innerHTML=`<table><tr><th>Barang</th><th>Qty standar</th></tr>${Object.entries(PK[o.value]).map(([k,q])=>`<tr><td>${nm(k)}</td><td>${q} ${BM[k][1]}</td></tr>`).join("")}</table>`}
async function upd(id,p,ok){try{await db.collection("trx").doc(id).update(p);if(ok)toast(ok)}catch(e){toast(e&&e.code==="permission-denied"?"Akun ini tidak punya izin menulis (coba login ulang).":"Gagal menyimpan, coba lagi.")}}
async function kirim(){const p=$("#f_p").value.trim();if(!p)return toast("Isi nama pasien / ID dulu.");const op=$("#f_o").value;
const t={pasien:p,dokter:$("#f_d").value,operasi:op,catatan:$("#f_c").value.trim(),tgl:Date.now(),status:"Diminta",items:Object.entries((()=>{const it={...PK[op]};for(const k in extra)it[k]=Math.round(((it[k]||0)+extra[k])*100)/100;return it})()).map(([k,q])=>({k,dim:q,dis:q,ret:0,st:"Belum Diinput"}))};
try{await db.collection("trx").doc("T"+Date.now().toString(36)).set(t);toast("Permintaan terkirim ke Farmasi.");extra={};tab="hist";render()}catch(e){toast(e&&e.code==="permission-denied"?"Akun ini tidak punya izin menulis.":"Gagal menyimpan.")}}
function vals(id){const o={};document.querySelectorAll(`input[data-t="${id}"]`).forEach(i=>o[i.dataset.k]=Math.max(0,Math.round((+i.value||0)*100)/100));return o}
function serah(id){const t=rows.find(x=>x.id===id),v=vals(id),s=stok();
for(const i of t.items){if(v[i.k]>s[i.k])return toast(`Stok ${BM[i.k][0]} tidak cukup (tersedia ${s[i.k]}).`)}
upd(id,{status:"Diserahkan ke OK",tglSerah:Date.now(),items:t.items.map(i=>({...i,dis:v[i.k]}))},"Ditandai diserahkan ke OK.")}
function tutup(id){const t=rows.find(x=>x.id===id),v=vals(id);
for(const i of t.items){if(v[i.k]>i.dis)return toast(`Retur ${BM[i.k][0]} melebihi yang disiapkan.`)}
const items=t.items.map(i=>({...i,ret:v[i.k],st:v[i.k]>0?"Menunggu Verifikasi":"Tidak Ada Retur"}));
upd(id,{items,status:items.some(i=>i.ret>0)?"Menunggu Verifikasi Retur":"Selesai"},"Input retur ditutup.")}
function verif(id,k){const t=rows.find(x=>x.id===id);
const items=t.items.map(i=>i.k===k?{...i,st:"Terverifikasi",tglVerif:Date.now()}:i);
upd(id,{items,status:items.some(i=>i.st==="Menunggu Verifikasi")?t.status:"Selesai"},"Retur terverifikasi, stok kembali.")}
function again(){if(pending&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){pending=false;render()}}
document.addEventListener("focusout",()=>setTimeout(again,50));
function go(){if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){pending=true;return}render()}
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
auth.onAuthStateChanged(u=>{
if(unsub){unsub();unsub=null}
sess=null;rows=[];need=1;
if(u&&u.email&&u.email.endsWith(DOM)){const n=u.email.slice(0,-DOM.length);
if(hasR(n)){sess=n;tab="dash";unsub=fs.collection("trx").onSnapshot(q=>{rows=q.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.tgl-x.tgl);need=0;go()},e=>{need=0;toast("Gagal memuat data. Cek aturan Firestore.");go()})}
else{$("#l_e").textContent="Akun ini belum diberi akses unit.";auth.signOut();return}}
render()});
render();
</script>
</body>
</html>
